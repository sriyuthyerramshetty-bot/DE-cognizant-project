name: Playwright Tests
on:
  push:
    branches: [ main, master, dev/*, development ]
  pull_request:
    branches: [ main, master, development ]
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      # Dummy values for Firebase - tests mock the actual auth calls
      VITE_FIREBASE_API_KEY: "test-api-key"
      VITE_FIREBASE_AUTH_DOMAIN: "test-project.firebaseapp.com"
      VITE_FIREBASE_PROJECT_ID: "test-project"
      VITE_FIREBASE_STORAGE_BUCKET: "test-project.appspot.com"
      VITE_FIREBASE_MESSAGING_SENDER_ID: "123456789"
      VITE_FIREBASE_APP_ID: "1:123456789:web:abc123"
      VITE_FIREBASE_MEASUREMENT_ID: "G-TEST123"
      # Dummy values for Supabase - tests don't actually call Supabase
      VITE_SUPABASE_URL: "https://test.supabase.co"
      VITE_SUPABASE_API_KEY: "test-supabase-key"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
